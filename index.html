<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172744"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="별빛칭찬단">
<title>별빛칭찬단 웹앱</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#172744;background:#f6f8ff}*{box-sizing:border-box}body{margin:0}#app{max-width:620px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 18px calc(35px + env(safe-area-inset-bottom))}h1{font-size:28px;margin:0 0 8px}h2{font-size:20px;margin:3px 0 9px}.hint,.stats{font-size:14px;color:#5d687e;line-height:1.55}.card{background:#fff;border-radius:20px;padding:15px;margin:12px 0;box-shadow:0 3px 15px #293a6010}.btn{border:0;border-radius:16px;color:#fff;background:#3d71ff;width:100%;min-height:54px;font-size:16px;font-weight:700;margin:6px 0;padding:10px}.navy{background:#172744}.green{background:#25a667}.coral{background:#f07567}.light{background:#e9efff;color:#23489f}.task{background:#f1f5ff;color:#244dba;text-align:left}.row{display:flex;gap:9px}.row .btn{flex:1}.kid{display:flex;gap:13px;align-items:center;border:2px solid transparent}.kid.active{border-color:#b7caff;background:#f7f9ff}.av{width:70px;height:82px;border-radius:18px;display:grid;place-items:center;font-size:37px;flex:none}.doyeop{background:#e6edff}.doha{background:#fff0e6}.doi{background:#f6eaff}.grow{flex:1}.name{font-size:19px;font-weight:800}.stars{color:#d28d10}.code{font-size:22px;font-weight:900;letter-spacing:2px;color:#3d71ff;background:#e9f0ff;border-radius:15px;padding:12px;text-align:center;word-break:break-all}.photo{width:100%;height:220px;object-fit:cover;border-radius:14px;margin:10px 0}.progress{height:12px;background:#edf0f7;border-radius:10px;overflow:hidden;margin:10px 0 5px}.progress i{display:block;height:100%;background:#f2aa2d}.top{display:flex;justify-content:space-between;gap:12px}.link{border:0;background:none;color:#315dbf;font-weight:700}.modal{position:fixed;inset:0;background:#14203a85;display:grid;place-items:end center;padding:20px;z-index:9}.sheet{width:min(620px,100%);background:#fff;border-radius:24px;padding:20px}.input{width:100%;border:1px solid #ccd4e4;border-radius:13px;padding:14px;font-size:18px;text-transform:uppercase;margin:8px 0}.hidden{display:none}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#172744;color:#fff;padding:12px 16px;border-radius:15px;z-index:30;max-width:90%;text-align:center}.camera{display:none}.reward{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #e6eaf4}.reward .btn{width:auto;min-height:38px;margin:0;border-radius:11px;font-size:14px}
</style></head><body><main id="app"></main><div id="modal"></div><div id="toast" class="toast hidden"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import{getDatabase,ref,onValue,update,push,remove,set,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const fb={apiKey:'AIzaSyBDi56Ff_0WFTVV63RP6boBsTEzWBllGzQ',authDomain:'our-home-praise.firebaseapp.com',databaseURL:'https://our-home-praise-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'our-home-praise',appId:'1:1098901145821:android:c0795a9fe88031e520b334'};
const db=getDatabase(initializeApp(fb)),auth=getAuth(),el=document.querySelector('#app'),modal=document.querySelector('#modal'),toast=document.querySelector('#toast');
const kids=[['doyeop','도엽','초등학교 4학년','🧒🏻','doyeop'],['doha','도하','초등학교 2학년','👦🏻','doha'],['doi','도이','6살','👸🏻','doi']],tasks=['밥 깨끗이 먹기','방 정리하기','숙제·책 읽기','가족 도와주기','다른 잘한 일'];let role='',family='',selected='doyeop',data={children:{},submissions:{}};
const q=s=>document.querySelector(s),kid=k=>kids.find(x=>x[0]===k)||kids[0],st=k=>data.children?.[k[0]]||{stars:0,xp:0,gems:0},lv=k=>1+Math.floor((+st(k).xp||0)/50),save=()=>localStorage.setItem('praise-web',JSON.stringify({role,family,selected}));
function say(t){toast.textContent=t;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),2600)}function btn(t,c,id){return '<button '+(id?'id="'+id+'"':'')+' class="btn '+c+'">'+t+'</button>'}function av(k){return '<div class="av '+k[4]+'">'+k[3]+'</div>'}function close(){modal.innerHTML=''}function sheet(s){modal.innerHTML='<div class="modal"><section class="sheet">'+s+'</section></div>';q('.modal').onclick=e=>{if(e.target.className==='modal')close()}}
function makeCode(){let s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r='';for(let i=0;i<10;i++)r+=s[Math.floor(Math.random()*s.length)];return r}async function create(c){let o={createdAt:serverTimestamp()};kids.forEach(k=>Object.assign(o,{['children/'+k[0]+'/stars']:0,['children/'+k[0]+'/xp']:0,['children/'+k[0]+'/gems']:0,['children/'+k[0]+'/stickers']:0,['children/'+k[0]+'/history']:''}));await update(ref(db,'families/'+c),o)}
function connect(c,r,newOne){let first=true;onValue(ref(db,'families/'+c),async x=>{if(first){first=false;if(!x.exists()){if(!newOne){say('연결 코드를 다시 확인해 주세요.');return home()}await create(c);return}role=r;family=c;save()}data=x.val()||data;render()})}
function home(){role='';family='';save();el.innerHTML='<h1>우리 집 칭찬 모험</h1><p class="hint">아이 사진을 올리면 부모님이 보고 별을 줘요. 아이폰과 갤럭시 모두 함께 쓸 수 있어요.</p><section class="card">'+btn('👨‍👩‍👧 부모님 폰으로 시작','navy','new')+btn('👩‍👩‍👧 다른 부모님 폰 연결하기','coral','parent')+btn('📱 아이 폰 연결하기','blue','child')+'<p class="hint">아이폰은 Safari 공유 버튼 → ‘홈 화면에 추가’를 누르면 앱처럼 쓸 수 있어요.</p></section>';q('#new').onclick=()=>{let c=makeCode();role='parent';family=c;save();connect(c,'parent',true)};q('#parent').onclick=()=>join('parent');q('#child').onclick=()=>join('child')}
function join(w){sheet('<h2>'+(w==='parent'?'다른 부모님 폰 연결':'아이 폰 연결')+'</h2><p class="hint">먼저 만든 부모님 폰에 보이는 가족 코드를 입력해요.</p><input id="code" class="input" maxlength="10" placeholder="예: ABCD1234EF">'+btn('연결하기',w==='parent'?'coral':'blue','go')+btn('취소','light','cancel'));q('#cancel').onclick=close;q('#go').onclick=()=>{let c=q('#code').value.trim().toUpperCase();if(c.length<8)return say('코드를 다시 확인해 주세요.');close();if(w==='parent'){role='parent';family=c;save();connect(c,'parent',false)}else choose(c)}}function choose(c){sheet('<h2>누구의 폰인가요?</h2><p class="hint">한 대의 폰으로 도엽·도하·도이 모두 사진을 올릴 수 있어요.</p>'+kids.map(k=>btn(k[3]+' '+k[1]+' · '+k[2],'light','k'+k[0])).join(''));kids.forEach(k=>q('#k'+k[0]).onclick=()=>{selected=k[0];role='child';family=c;save();close();connect(c,'child',false)})}
function cards(){return kids.map(k=>'<section class="card kid '+(selected===k[0]?'active':'')+'" data-k="'+k[0]+'">'+av(k)+'<div class="grow"><div class="name">'+k[1]+' · '+k[2]+'</div><div class="stats">Lv.'+lv(k)+' · <span class="stars">★ '+(+st(k).stars||0)+'</span></div></div></section>').join('')}function growth(k){let d=st(k),x=(+d.xp||0)%50;return '<section class="card"><div class="row">'+av(k)+'<div class="grow"><div class="name">'+k[1]+'의 성장</div><div class="stats">Lv.'+lv(k)+' · 별 '+(+d.stars||0)+'개 · 💎 '+(+d.gems||0)+'/3</div></div></div><div class="progress"><i style="width:'+(x*2)+'%"></i></div><div class="hint">경험치 '+x+' / 50</div></section>'}
function parentPane(){let a=Object.entries(data.submissions||{});let photos=a.length?a.map(([id,p])=>'<section class="card"><div class="name">'+kid(p.child)[1]+' · '+p.task+'</div><img class="photo" src="'+p.photo+'"><div class="row">'+btn('잘했어!<br>별 5개 승인','green','yes'+id)+btn('승인 안 함<br>사진만 삭제','coral','no'+id)+'</div></section>').join(''):'<section class="card"><h2>아직 사진이 없어요.</h2><p class="hint">아이가 사진을 올리면 여기서 바로 확인할 수 있어요.</p></section>';return '<h2>올라온 사진 '+a.length+'건</h2>'+photos+'<section class="card"><h2>'+kid(selected)[1]+'의 보상</h2>'+[['간식 고르기',10],['원하는 물건 1만원권',50],['원하는 물건 2만원권',100],['원하는 물건 3만원권',150],['원하는 물건 5만원권',250],['원하는 물건 10만원권',500],['생물 받기',1000]].map(x=>'<div class="reward"><span><b>'+x[0]+'</b><br><span class="stats">★ '+x[1]+'</span></span><button data-cost="'+x[1]+'" data-name="'+x[0]+'" class="btn green reward">받기</button></div>').join('')+'</section>'}function childPane(){return '<section class="card"><h2>사진 찍어서 올리기</h2><p class="hint">이번에 잘한 아이를 위에서 고른 뒤 사진을 올리면 돼요.</p>'+btn('📷 '+kid(selected)[1]+' 사진 찍어서 올리기','blue','take')+'<input class="camera" id="camera" type="file" accept="image/*" capture="environment"></section>'}
function render(){if(!role||!family)return home();let k=kid(selected);el.innerHTML='<div class="top"><div><h1>우리 집 칭찬 모험</h1><div class="hint">'+(role==='parent'?'부모님 화면':'아이 사진 올리기')+'</div></div><button class="link" id="leave">연결 바꾸기</button></div>'+(role==='parent'?'<section class="card"><div class="hint">아이·다른 부모님 폰 연결 코드</div><div class="code">'+family+'</div><p class="hint">엄마·아빠 모두 이 코드로 연결하면 사진 승인·보상 승인을 함께 할 수 있어요.</p></section>':'')+cards()+growth(k)+(role==='parent'?parentPane():childPane())+'<p class="hint">사진은 부모님이 승인하거나 승인하지 않으면 자동으로 지워집니다.</p>';q('#leave').onclick=home;document.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{selected=x.dataset.k;save();render()});kids.forEach(k=>{Object.keys(data.submissions||{}).forEach(id=>{let p=data.submissions[id];if(q('#yes'+id))q('#yes'+id).onclick=()=>approval(id,true);if(q('#no'+id))q('#no'+id).onclick=()=>approval(id,false)})});document.querySelectorAll('.reward').forEach(b=>b.onclick=()=>reward(b.dataset.name,+b.dataset.cost));if(q('#take'))q('#take').onclick=()=>taskPick();if(q('#camera'))q('#camera').onchange=e=>upload(e.target.files[0])}
function pin(title,go){sheet('<h2>'+title+'</h2><input id="pin" class="input" type="password" inputmode="numeric" maxlength="4" placeholder="부모님 비밀번호">'+btn('확인','navy','ok')+btn('취소','light','cancel'));q('#cancel').onclick=close;q('#ok').onclick=()=>{if(q('#pin').value!=='1234')return say('비밀번호가 맞지 않아요.');close();go()}}function approval(id,yes){pin(yes?'사진 승인':'사진 승인 안 함',async()=>{let p=data.submissions[id];if(yes){let k=kid(p.child),d=st(k),icon=p.task.includes('밥')?'🍽':p.task.includes('방')?'🧹':'🌟';await update(ref(db,'families/'+family),{['children/'+k[0]+'/stars']:(+d.stars||0)+5,['children/'+k[0]+'/xp']:(+d.xp||0)+10,['children/'+k[0]+'/gems']:(+d.gems||0)+1,['children/'+k[0]+'/stickers']:(+d.stickers||0)+1,['children/'+k[0]+'/history']:(d.history?d.history+'|':'')+icon,['submissions/'+id]:null});say('승인했어요! 별 5개를 줬어요.')}else{await remove(ref(db,'families/'+family+'/submissions/'+id));say('별은 주지 않고 사진만 지웠어요.')}})}
function reward(name,c){let k=kid(selected),d=st(k);if((+d.stars||0)<c)return say('별이 '+(c-(+d.stars||0))+'개 더 필요해요.');pin(name+' 보상 승인',()=>set(ref(db,'families/'+family+'/children/'+k[0]+'/stars'),(+d.stars||0)-c).then(()=>say('요청 완료! 부모님과 함께 골라 봐요.')))}function taskPick(){sheet('<h2>'+kid(selected)[1]+'가 무엇을 잘했나요?</h2>'+tasks.map((t,i)=>btn(t,'task','t'+i)).join('')+btn('취소','light','cancel'));tasks.forEach((t,i)=>q('#t'+i).onclick=()=>{q('#camera').dataset.task=t;close();q('#camera').click()});q('#cancel').onclick=close}function upload(f){if(!f)return;let task=q('#camera').dataset.task;if(!task)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),w=im.width,h=im.height,z=Math.min(900/w,900/h,1);c.width=w*z;c.height=h*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);push(ref(db,'families/'+family+'/submissions'),{child:selected,task,photo:c.toDataURL('image/jpeg',.76),time:serverTimestamp()}).then(()=>say('사진을 올렸어요! 부모님 폰에서 확인해 주세요.'))};im.src=r.result};r.readAsDataURL(f)}
try{let saved=JSON.parse(localStorage.getItem('praise-web')||'{}');role=saved.role||'';family=saved.family||'';selected=saved.selected||'doyeop'}catch(e){}signInAnonymously(auth).then(()=>family&&role?connect(family,role,false):home()).catch(()=>el.innerHTML='<section class="card"><h2>온라인 연결에 실패했어요.</h2><p class="hint">잠시 후 다시 열어 주세요.</p></section>');
</script></body></html>
